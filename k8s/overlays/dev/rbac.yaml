apiVersion: v1
kind: ServiceAccount
metadata:
  name: dev-deployer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dev-role
rules:
- apiGroups: ["", "apps"]
  resources: ["pods", "deployments", "services"]
  verbs: ["get","list","watch","create","update","delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev-binding
subjects:
- kind: ServiceAccount
  name: dev-deployer
roleRef:
  kind: Role
  name: dev-role
  apiGroup: rbac.authorization.k8s.io

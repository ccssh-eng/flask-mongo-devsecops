apiVersion: v1
kind: ServiceAccount
metadata:
  name: prod-deployer
  namespace: prod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prod-role
  namespace: prod
rules:
- apiGroups: ["", "apps"]
  resources: ["pods", "deployments", "services"]
  verbs: ["get","list","watch","update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prod-binding
  namespace: prod
subjects:
- kind: ServiceAccount
  name: prod-deployer
roleRef:
  kind: Role
  name: prod-role
  apiGroup: rbac.authorization.k8s.io
